<main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
  <header class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-600 to-teal-700
                 p-6 text-white shadow-xl shadow-emerald-700/20">
    <div class="absolute -top-10 -left-10 size-40 rounded-full bg-white/10"></div>
    <div class="absolute -bottom-16 left-20 size-48 rounded-full bg-white/5"></div>

    <p class="relative text-sm text-emerald-100">
      جمع خرج {{ monthName }} {{ year | faNumber: false }}
    </p>
    <p class="relative mt-2 text-4xl font-extrabold">
      {{ expenseService.thisMonthTotal() | faNumber }}
      <span class="text-lg font-medium text-emerald-100">تومان</span>
    </p>
  </header>

  <div class="grid gap-6 lg:grid-cols-2 items-start">
    <div class="lg:sticky lg:top-6 bg-white rounded-3xl shadow-xl shadow-slate-200/70 p-6">
      <app-expense-form (submitted)="expenseService.add($event)" />
    </div>
   <div class="flex flex-col gap-6">
      <app-category-summary />
      <app-expense-list />
    </div>
  </div>
</main>
