<section class="bg-white rounded-3xl shadow-xl shadow-slate-200/70 p-6">
  <h2 class="text-lg font-bold mb-5">این ماه خرجت کجا رفت؟</h2>

  @for (item of expenseService.categoryBreakdown(); track item.category) {
    <div class="mb-4 last:mb-0">
      <div class="flex items-center justify-between mb-2 text-sm">
        <span class="flex items-center gap-2 font-medium">
          <span class="text-lg">{{ icons[item.category] }}</span>
          {{ labels[item.category] }}
        </span>
        <span class="text-slate-500">
          {{ item.total | faNumber }} تومان
          <span class="mr-1 font-bold text-emerald-700">{{ item.percent | faNumber }}٪</span>
        </span>
      </div>
      <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden">
        <div class="h-full rounded-full bg-gradient-to-l from-emerald-500 to-teal-400
                    transition-all duration-500"
             [style.width.%]="item.percent"></div>
      </div>
    </div>
  } @empty {
    <p class="text-center py-6 text-slate-400">این ماه هنوز خرجی ثبت نشده</p>
  }
</section>
