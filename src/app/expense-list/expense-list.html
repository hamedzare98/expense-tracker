<section class="bg-white rounded-3xl shadow-xl shadow-slate-200/70 p-6">
  <h2 class="text-lg font-bold mb-4">خرج‌های اخیر</h2>

  @for (e of expenseService.sortedExpenses(); track e.id) {
    <div class="flex items-center gap-3 py-3 border-b border-slate-100 last:border-0">
      <div class="size-12 shrink-0 grid place-items-center rounded-2xl bg-slate-50 text-2xl">
        {{ icons[e.category] }}
      </div>

      <div class="flex-1 min-w-0">
        <p class="font-medium truncate">{{ e.note || labels[e.category] }}</p>
        <p class="text-xs text-slate-400 mt-1">
          {{ labels[e.category] }} · {{ e.date | jalaliDate }}
        </p>
      </div>

      <p class="font-bold text-slate-700 whitespace-nowrap">
        {{ e.amount | faNumber }}
        <span class="text-xs font-normal text-slate-400">تومان</span>
      </p>

      <div class="flex shrink-0">
        <button type="button" (click)="edit(e)" aria-label="ویرایش"
          class="size-9 grid place-items-center rounded-xl text-slate-300
                 hover:bg-emerald-50 hover:text-emerald-600 transition">
          ✎
        </button>
        <button type="button" (click)="confirmDelete(e)" aria-label="حذف"
          class="size-9 grid place-items-center rounded-xl text-slate-300
                 hover:bg-rose-50 hover:text-rose-600 transition">
          ✕
        </button>
      </div>
    </div>
  } @empty {
    <div class="text-center py-10 text-slate-400">
      <p class="text-4xl mb-2">🪙</p>
      <p>هنوز خرجی ثبت نکردی</p>
    </div>
  }
</section>
